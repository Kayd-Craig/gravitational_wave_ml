classes:
  names:
  - BBH
  - BNS
  - Glitch
  weights:
  - 5.0
  - 8.0
  - 1.0
cnn_lstm:
  cnn_channels:
  - 32
  - 64
  - 128
  dropout: 0.3
  lstm_hidden: 64
  lstm_layers: 1
data:
  bandpass_high: 500
  bandpass_low: 20
  bandpass_order: 8
  data_dir: data/raw
  processed_dir: data/processed
  q_transform:
    frange:
    - 20
    - 500
    logf: true
    norm: median
    qrange:
    - 4
    - 64
  sample_rate: 4096
  segment_length: 4.0
  synthetic_dir: data/synthetic
  test_split: 0.15
  train_split: 0.7
  val_split: 0.15
evaluation:
  far_threshold: 0.001
  output_dir: results
model:
  cnn1d_channels:
  - 64
  - 128
  - 256
  dropout: 0.3
  lstm_hidden: 256
  lstm_layers: 2
  name: cnn_spectrogram
  num_classes: 3
  pretrained: true
pycbc_waveforms:
  bbh:
    approximant: IMRPhenomD
    mass1_range:
    - 10
    - 80
    mass2_range:
    - 10
    - 80
    spin1z_range:
    - -0.9
    - 0.9
    spin2z_range:
    - -0.9
    - 0.9
  bns:
    approximant: TaylorF2
    mass1_range:
    - 1.0
    - 2.5
    mass2_range:
    - 1.0
    - 2.5
    spin1z_range:
    - -0.05
    - 0.05
    spin2z_range:
    - -0.05
    - 0.05
  snr_range:
  - 8
  - 30
training:
  batch_size: 32
  checkpoint_dir: checkpoints
  learning_rate: 0.0005
  log_dir: logs
  lr: 0.0005
  min_delta: 0.0001
  num_epochs: 50
  num_workers: 4
  patience: 12
  pin_memory: true
  scheduler: cosine
  seed: 42
  use_smote: false
  weight_decay: 1.0e-05
